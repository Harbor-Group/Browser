<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor</title>
<style>/* HARBOR_WORKSPACE_CSS */</style>
</head>
<body>
<div class="workspace">
  <aside class="sidebar">
    <div class="side-brand" id="workspace-brand">Harbor</div>
    <nav class="side-nav" id="workspace-nav" aria-label="Workspace"></nav>
  </aside>
  <main class="content" id="view"></main>
</div>
<script>/* HARBOR_SDK_JS */</script>
<script>/* HARBOR_PAGES_JS */</script>
<script>
'use strict';

const navigation = [
  [['home', 'Home', 'home'], ['bookmarks', 'Bookmarks', 'bookmarks'], ['history', 'History', 'history'], ['logins', 'Logins', 'logins']],
  [['adblock', 'Adblocker', 'shield'], ['scripts', 'User Scripts', 'scripts'], ['extensions', 'Extensions', 'extensions']],
  [['server', 'Home Server', 'server'], ['settings', 'Settings', 'settings']]
];
document.getElementById('workspace-brand').insertAdjacentHTML('afterbegin', icon('brand'));
document.getElementById('workspace-nav').innerHTML = navigation.map(group =>
  `<div class="side-group">${group.map(([route, label, glyph]) =>
    `<button type="button" class="sidebtn" data-route="${route}">${icon(glyph)}<span>${label}</span></button>`
  ).join('')}</div>`
).join('');
document.querySelectorAll('[data-route]').forEach(btn =>
  btn.addEventListener('click', () => setRoute(btn.dataset.route))
);

let currentView;

function render() {
  currentView?.abort();
  currentView = new AbortController();
  const { signal } = currentView;
  const route = currentRoute();
  document.documentElement.dataset.page = route;
  const section = ({ vault: 'server', 'install-script': 'scripts' })[route] || route;
  document.querySelectorAll('[data-route]').forEach(button => {
    if (button.dataset.route === section) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  const view = document.getElementById('view');

  if (['setup', 'server', 'vault'].includes(route)) { renderServer(view, route === 'setup'); return; }
  if (route === 'install-script') { renderScriptReview(view, signal); return; }
  if (route === 'home') { renderHomeDashboard(view); return; }
  if (route === 'bookmarks') { renderBookmarksDashboard(view); return; }
  if (route === 'history') { renderHistoryDashboard(view, signal); return; }
  if (route === 'logins') { renderLoginsDashboard(view); return; }
  if (route === 'adblock') { renderAdblockDashboard(view); return; }
  if (route === 'scripts') { renderScriptsDashboard(view, signal); return; }
  if (route === 'extensions') { renderExtensionsDashboard(view, signal); return; }
  renderSettingsDashboard(view);
}

window.addEventListener('hashchange', render);
window.addEventListener('pagehide', () => currentView?.abort());
window.addEventListener('pageshow', event => { if (event.persisted && currentRoute() !== 'install-script') render(); });
render();
</script>
</body>
</html>
