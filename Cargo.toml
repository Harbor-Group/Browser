[package]
name = "browser-client"
version = "1.0.0"
edition = "2024"

[lib]
name = "harbor"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "harbor"
path = "src/main.rs"

[features]
default = []
# Enable once Spotify CEF binaries are downloaded and CEF_PATH is set.
cef-runtime = ["dep:cef"]

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
base64 = "0.23"
cef = { version = "156", optional = true }
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
flate2 = "1.1"
keyring = "3.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared-protocol = { path = "shared-protocol" }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.21", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
